version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: travelmind-postgres
    environment:
      POSTGRES_USER: travelmind
      POSTGRES_PASSWORD: travelmind_dev_password
      POSTGRES_DB: travelmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: travelmind-redis
    command: redis-server --appendonly yes --requirepass travelmind_dev
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelmind-api-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: info
      DATABASE_URL: "postgres://travelmind:travelmind_dev_password@postgres:5432/travelmind?sslmode=disable"
      REDIS_URL: "redis://:travelmind_dev@redis:6379/0"
      JWT_SECRET: "dev-secret-key-change-in-production"
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-sk-ant-placeholder}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-travelmind-dev}
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./backend:/app
    command: go run ./cmd/api-gateway/main.go
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Booking Orchestrator Service
  booking-orchestrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelmind-booking-orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: booking-orchestrator
      DATABASE_URL: "postgres://travelmind:travelmind_dev_password@postgres:5432/travelmind?sslmode=disable"
      REDIS_URL: "redis://:travelmind_dev@redis:6379/0"
    ports:
      - "8081:8081"
    volumes:
      - ./backend:/app

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: travelmind-prometheus
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: travelmind-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Jaeger Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: travelmind-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "16686:16686" # UI

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: travelmind-network
